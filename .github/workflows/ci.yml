name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Frontend install, typecheck, build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Also regenerates the TS bindings (ts-rs) into apps/desktop/src/bindings.
      - run: cargo test --workspace
      - name: TS bindings are up to date
        shell: bash
        run: |
          git diff --exit-code -- apps/desktop/src/bindings || {
            echo "::error::Rust types changed: run 'cargo test' and commit apps/desktop/src/bindings"; exit 1; }
          test -z "$(git ls-files --others --exclude-standard apps/desktop/src/bindings)" || {
            echo "::error::New TS bindings were generated but not committed"; exit 1; }
