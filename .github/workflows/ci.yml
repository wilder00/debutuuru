name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux deps for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # pnpm's version comes from `packageManager` in apps/desktop/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Frontend install, typecheck, build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Also regenerates the TS bindings (ts-rs) into apps/desktop/src/bindings.
      - run: cargo test --workspace
      # The WSL agent must keep cross-building as a static binary (no C deps).
      - name: Linux agent (musl) builds
        run: cargo build -p debutuuru --target x86_64-unknown-linux-musl
      - name: TS bindings are up to date
        shell: bash
        run: |
          git diff --exit-code -- apps/desktop/src/bindings || {
            echo "::error::Rust types changed: run 'cargo test' and commit apps/desktop/src/bindings"; exit 1; }
          test -z "$(git ls-files --others --exclude-standard apps/desktop/src/bindings)" || {
            echo "::error::New TS bindings were generated but not committed"; exit 1; }
