name: Release

# Builds installers for every tag vX.Y.Z and attaches them to a GitHub Release.
# The Windows installer bundles the static Linux agent used for WSL repos.
# The Windows installers also put the `debutuuru` CLI on PATH.
# Installers are signed for the in-app updater, which reads latest.json
# from the newest release. Phase 3 still lacks Windows code signing.
#
# Releases are immutable once published (repo setting), so the release is
# created as a draft, every build uploads to it, and it's published last.
# A failed build leaves the draft unpublished.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f name="Debutuuru $TAG" \
            -F draft=true -F generate_release_notes=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux deps for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # pnpm's version comes from `packageManager` in apps/desktop/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      # Static Linux agent (rust-lld, see .cargo/config.toml), bundled into the
      # Windows app so it can serve repos inside any WSL distro.
      - name: Build Linux agent for WSL
        if: runner.os == 'Windows'
        run: cargo build --release -p debutuuru --target x86_64-unknown-linux-musl
      # Built before the app: the Windows installers bundle it as
      # `bin\debutuuru.exe` and put that folder on PATH. Also uploaded alone below.
      - name: Build CLI
        run: cargo build --release -p debutuuru
      # Builds the app plus MSI/NSIS (Windows) or deb/AppImage/rpm (Linux),
      # using the project's own @tauri-apps/cli (pnpm tauri).
      # tauri.release.conf.json turns on updater artifacts: each installer gets
      # a .sig made with the private key in the secrets below, and latest.json
      # (one entry per OS/arch/bundle type) is uploaded to the release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ runner.os == 'Windows' && '--config src-tauri/tauri.release.conf.json --config src-tauri/tauri.windows-release.conf.json' || '--config src-tauri/tauri.release.conf.json' }}
          # Generic `windows-x86_64` entry: the per-user setup.exe (no admin).
          # Installed apps pick their own type (`-nsis` / `-msi`) first.
          updaterJsonPreferNsis: true
          # The draft above: assets and latest.json go there. The tag keeps
          # latest.json's download URLs pointing at this version's files.
          releaseId: ${{ needs.draft.outputs.id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
      # The CLI ships separately too (servers, WSL without the app, scripts).
      - name: Upload CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            f="debutuuru-${{ github.ref_name }}-x86_64-windows.exe"; cp target/release/debutuuru.exe "$f"
          else
            f="debutuuru-${{ github.ref_name }}-x86_64-linux"; cp target/release/debutuuru "$f"
          fi
          # By release id: a draft can't be found by its tag. A re-run replaces
          # the file uploaded before.
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq ".[] | select(.name == \"$f\") | .id")
          if [ -n "$old" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
            --data-binary "@$f" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$f" > /dev/null
          echo "Uploaded $f"

  # Everything uploaded: publish (from here on the release can't change) and
  # mark it latest, which is where installed apps look for updates.
  publish:
    needs: [draft, desktop]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: |
          # Each build merges its platforms into latest.json; two finishing at
          # once could lose one's. Once published it can't be fixed, so check.
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[] | select(.name == "latest.json") | .id')
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset" -H "Accept: application/octet-stream" > latest.json
          jq -e '.platforms | has("windows-x86_64") and has("linux-x86_64")' latest.json > /dev/null \
            || { echo "latest.json misses a platform: $(jq -c '.platforms | keys' latest.json). Re-run the failed build, then this job."; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true --jq .html_url
