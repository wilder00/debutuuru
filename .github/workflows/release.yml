name: Release

# Builds installers for every tag vX.Y.Z and attaches them to a GitHub Release.
# Phase 3 adds: bundling the Linux agent into the Windows installer, signed
# updater manifests, and Windows code signing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci
      # Builds the app plus MSI/NSIS (Windows) or deb/AppImage/rpm (Linux),
      # using the project's own @tauri-apps/cli (npm run tauri).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Debutuuru ${{ github.ref_name }}"
          releaseDraft: false
      # The CLI ships separately too (servers, WSL without the app, scripts).
      - name: Build CLI
        run: cargo build --release -p debutuuru
      - name: Upload CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            f="debutuuru-${{ github.ref_name }}-x86_64-windows.exe"; cp target/release/debutuuru.exe "$f"
          else
            f="debutuuru-${{ github.ref_name }}-x86_64-linux"; cp target/release/debutuuru "$f"
          fi
          gh release upload "${{ github.ref_name }}" "$f" --clobber
