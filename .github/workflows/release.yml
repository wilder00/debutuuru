name: Release

# Builds installers for every tag vX.Y.Z and attaches them to a GitHub Release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Builds the app plus MSI/NSIS (Windows) or deb/AppImage/rpm (Linux).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Debutuuru ${{ github.ref_name }}"
          releaseDraft: false
      # The CLI is shipped separately so it can live inside WSL / on servers.
      - name: Build CLI
        run: cargo build --release -p debutuuru
      - name: Upload CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/debutuuru.exe "debutuuru-${{ github.ref_name }}-x86_64-windows.exe"
            gh release upload "${{ github.ref_name }}" "debutuuru-${{ github.ref_name }}-x86_64-windows.exe" --clobber
          else
            cp target/release/debutuuru "debutuuru-${{ github.ref_name }}-x86_64-linux"
            gh release upload "${{ github.ref_name }}" "debutuuru-${{ github.ref_name }}-x86_64-linux" --clobber
          fi
