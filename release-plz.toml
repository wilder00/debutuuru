# Automated versioning. See docs/VERSIONING.md.
# release-plz reads Conventional Commits, opens a "release" PR that bumps the
# workspace version + CHANGELOG.md, and tags `vX.Y.Z` when that PR is merged.

[workspace]
changelog_update = false   # one product changelog, owned by `debutuuru` (below)
# Nothing goes to crates.io: the previous version comes from git tags
# (`git_tag_name`), and an untagged package is an initial release.
git_only = true
publish = false            # never cargo publish
# Tag only when the release PR is merged, never on every push to main.
release_always = false
git_release_enable = false # the Release workflow builds installers and creates the GitHub Release
git_tag_enable = false     # only the CLI package creates the product tag (below)
# Every package reads its previous version from the product tag. Without this,
# packages that never create tags have none, count as an initial release, and
# `changelog_include` pulls their whole history into each new release.
git_tag_name = "v{{ version }}"
semver_check = false
# `feat:` bumps the minor version in 0.x too (0.1.2 → 0.2.0). release-plz's
# default follows Cargo's 0.x rule (features → patch, because 0.x → 0.(x+1)
# means a breaking change to crates that depend on it); we publish no crates,
# and for an app new features should read as a minor release.
features_always_increment_minor = true

# The product is versioned as one unit; the `debutuuru` package carries the tag
# and the changelog for the whole workspace.
[[package]]
name = "debutuuru"
git_tag_enable = true
changelog_path = "CHANGELOG.md"
changelog_update = true
changelog_include = ["debutuuru-core", "debutuuru-protocol", "debutuuru-agent", "debutuuru-desktop", "debutuuru-ui"]
