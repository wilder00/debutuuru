[package]
name = "debutuuru"
description = "Debutuuru command line: inspect repos and open the desktop app from any terminal (Windows, Linux, WSL)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "debutuuru"
path = "src/main.rs"

[dependencies]
debutuuru-core.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
