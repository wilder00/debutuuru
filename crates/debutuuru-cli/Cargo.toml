[package]
name = "debutuuru"
description = "Debutuuru command line: open the desktop app from any terminal (Windows, Linux, WSL), run the agent, inspect repos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "debutuuru"
path = "src/main.rs"

[dependencies]
debutuuru-core.workspace = true
debutuuru-agent.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
debutuuru-protocol.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
