[package]
name = "debutuuru-agent"
description = "Debutuuru agent: hosts tool modules (git, …) and serves them in-process or over stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
debutuuru-core.workspace = true
debutuuru-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
# Default features only: inotify on Linux (works in a static musl build),
# ReadDirectoryChangesW on Windows.
notify = "8.2"
# OS randomness for the askpass bridge token.
getrandom = "0.4"
