[env]
# `cargo test` writes the TypeScript bindings here (ts-rs). CI fails if they drift.
TS_RS_EXPORT_DIR = { value = "apps/desktop/src/bindings", relative = true }

# The Linux agent (shipped inside the Windows app for WSL) is cross-built from
# Windows with Rust's bundled linker: static musl, no C toolchain needed.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[alias]
# CI also builds on Linux. On Windows, `cfg(windows)`-only callers hide dead
# code and other Linux-only errors: run `cargo clippy-linux` before committing.
# Covers every crate except the desktop shell (that one needs GTK, see CLAUDE.md).
clippy-linux = "clippy -p debutuuru -p debutuuru-core -p debutuuru-agent -p debutuuru-protocol --all-targets --target x86_64-unknown-linux-musl -- -D warnings"
