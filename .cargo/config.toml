[env]
# `cargo test` writes the TypeScript bindings here (ts-rs). CI fails if they drift.
TS_RS_EXPORT_DIR = { value = "apps/desktop/src/bindings", relative = true }

# The Linux agent (shipped inside the Windows app for WSL) is cross-built from
# Windows with Rust's bundled linker: static musl, no C toolchain needed.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
