[workspace]
resolver = "2"
members = [
    "crates/debutuuru-core",
    "crates/debutuuru-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
# Single version for the whole product. Bumped by release-plz (see release-plz.toml).
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/wilder00/debutuuru"
authors = ["wilder00"]

[workspace.dependencies]
debutuuru-core = { path = "crates/debutuuru-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
