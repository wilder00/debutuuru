[workspace]
resolver = "2"
members = [
    "crates/debutuuru-core",
    "crates/debutuuru-protocol",
    "crates/debutuuru-agent",
    "crates/debutuuru-cli",
    "apps/desktop/src-tauri",
    "apps/desktop", # debutuuru-ui: versioning marker for the React UI
]

[workspace.package]
# Single version for the whole product. Bumped by release-plz (see release-plz.toml).
version = "0.1.2"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/wilder00/debutuuru"

[workspace.dependencies]
debutuuru-core = { path = "crates/debutuuru-core" }
debutuuru-protocol = { path = "crates/debutuuru-protocol" }
debutuuru-agent = { path = "crates/debutuuru-agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# TypeScript types for the UI are generated from Rust (see .cargo/config.toml).
ts-rs = { version = "12", features = ["serde-json-impl"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
