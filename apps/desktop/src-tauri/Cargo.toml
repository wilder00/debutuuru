[package]
name = "debutuuru-desktop"
description = "Debutuuru desktop app (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "debutuuru-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
debutuuru-core.workspace = true
debutuuru-protocol.workspace = true
debutuuru-agent.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
tauri-plugin-single-instance = "2.5"
# protocol-asset: serves the user's background image from the app data folder.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
# Links in rendered Markdown open in the default browser.
tauri-plugin-opener = "2.7"
