<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Debutuuru</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <strong>Debutuuru</strong>
    <input id="path" placeholder="Repository path (C:\repo, /home/me/repo, \\wsl.localhost\Ubuntu\home\me\repo)" />
    <button id="open">Open</button>
    <button id="refresh" title="Refresh">&#x21bb;</button>
    <span id="repo-badges"></span>
    <span id="version"></span>
  </header>
  <div id="error" hidden></div>
  <main>
    <aside>
      <h3>Branches</h3>
      <ul id="branches"></ul>
      <h3>Worktrees</h3>
      <ul id="worktrees"></ul>
    </aside>
    <section id="graph-pane">
      <div id="log"></div>
    </section>
    <section id="changes-pane">
      <h3>Staged</h3>
      <ul id="staged"></ul>
      <h3>Changes</h3>
      <ul id="unstaged"></ul>
      <textarea id="message" placeholder="Commit message"></textarea>
      <button id="commit">Commit</button>
      <pre id="diff"></pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
